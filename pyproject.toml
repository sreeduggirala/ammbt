[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ammbt"
version = "0.3.0"
description = "High-performance vectorized backtesting engine for AMM LP positions"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sree Duggirala" }]
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/sreeduggirala/ammbt"
Repository = "https://github.com/sreeduggirala/ammbt"
Changelog = "https://github.com/sreeduggirala/ammbt/blob/main/CHANGELOG.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "numba>=0.58.0",
  "plotly>=5.18.0",
  "scipy>=1.11.0",
]

[project.optional-dependencies]
data = [
  "requests>=2.28.0",
  "aiohttp>=3.8.0",
  "websockets>=11.0.0",
]
dev = [
  "jupyter>=1.0.0",
  "notebook>=7.0.0",
  "pytest>=7.4.0",
  "black>=23.0.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "hypothesis>=6.90.0",
]
all = [
  "ammbt[data,dev]",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["ammbt"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
